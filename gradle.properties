# Project-wide Gradle settings for AutoMirror Android Auto App.

# AndroidX is required for androidx.car.app and modern support libraries
android.useAndroidX=true

# Enables namespacing for each library's R class so that its R class includes only the
# resources declared in the library itself and not from the library's dependencies
android.nonTransitiveRClass=true

# Gradle JVM memory allocation & encoding
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official
