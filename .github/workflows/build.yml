name: Build & Release AutoMirror Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Consistent debug.keystore
        run: |
          if [ -f app/debug.keystore ]; then
            echo "Consistent debug.keystore found in repository."
          else
            echo "Error: app/debug.keystore missing! Keystore consistency must be maintained across all builds."
            exit 1
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew || true

      - name: Build Android Release & Debug APKs with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace
          else
            gradle assembleRelease assembleDebug --stacktrace
          fi

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | head -n1 | awk '{print $3}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Version: $VERSION_NAME (Code: $VERSION_CODE)"

      - name: Copy & Rename APKs for Distribution
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/ \;
          cd build-artifacts
          if [ -f "app-release.apk" ]; then
            cp app-release.apk AutoMirror-${{ env.VERSION_NAME }}-release.apk
          fi
          if [ -f "app-debug.apk" ]; then
            cp app-debug.apk AutoMirror-${{ env.VERSION_NAME }}-debug.apk
          fi
          ls -la

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoMirror-APK-v${{ env.VERSION_NAME }}
          path: build-artifacts/*.apk

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AutoMirror v${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          files: build-artifacts/*.apk
          body: |
            ## AutoMirror v${{ env.VERSION_NAME }} Release
            Live full-screen phone screen mirroring for Android Auto vehicle displays.
            
            ### Included Assets:
            - `AutoMirror-${{ env.VERSION_NAME }}-release.apk` (Signed with consistent FourgeAI Labs Keystore)
            - `AutoMirror-${{ env.VERSION_NAME }}-debug.apk`
            
            ### What's New in v${{ env.VERSION_NAME }}:
            - Full-screen takeover on Android Auto vehicle head units
            - High-FPS live phone screen projection via MediaProjection API
            - Touch Relay via Accessibility Service dispatch gestures
            - Custom automotive aspect ratios (16:9, Ultrawide 21:9, 4:3)
            - Persistent FourgeAI Labs signing configuration
            
            Created by **FourgeAI LABS** (https://github.com/fourgeailabs)
            Licensed under FOURGEAI LABS PROPRIETARY SOFTWARE LICENSE Version 1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
